<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Client - CRM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        textarea {
            grid-column: span 2;
            resize: vertical;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .radio-group label {
            margin-bottom: 0;
        }
        button {
            grid-column: span 2;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Add New Prospect</h1>
    <form action="#" method="post">
        <div class="form-group">
            <label for="clientName">Prospect Name</label>
            <input type="text" name="prospectName_ctrl" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone #</label>
            <input type="tel" name="phone_ctrl" required>
        </div>
        <div class="form-group">
            <label for="email_ctrl">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="website_ctrl">Website</label>
            <input type="url" id="website" name="website">
        </div>
        <div class="form-group">
            <label>Industry</label>
            <select name="Industry_ctrl" size="5">
                    <option value="technology">Technology</option>
                    <option value="finance">Finance</option>
                    <option value="healthcare">Healthcare</option>
                    <option value="education">Education</option>
                    <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="notes">Other Details</label>
            <textarea id="details" name="details" rows="5"></textarea>
        </div>
        <button type="submit">Add Prospect</button>
    </form>
</div>

</body>
</html>
